databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: mahmoud
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: gender
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: birth_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: height_cm
                  type: decimal(5,2)
                  constraints:
                    nullable: false
              - column:
                  name: weight_kg
                  type: decimal(5,2)
                  constraints:
                    nullable: false
              - column:
                  name: goal
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: fitness_level
                  type: VARCHAR(255)
              - column:
                  name: training_days
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: plan_id
                  type: BIGINT
              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
              - column:
                  name: deleted
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValueBoolean: false
              - column:
                  name: daily_calories
                  type: INT
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: plan_id
            constraintName: fk_users_workout_plan
            referencedTableName: workout_plan
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: RESTRICT

        - createIndex:
            indexName: idx_user_email
            tableName: users
            columns:
              - column:
                  name: email