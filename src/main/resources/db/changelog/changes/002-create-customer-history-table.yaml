databaseChangeLog:
  - changeSet:
      id: 002-create-user-history-table
      author: mahmoud
      changes:
        - createTable:
            tableName: user_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: height_cm
                  type: decimal(5,2)
                  constraints:
                    nullable: false
              - column:
                  name: weight_kg
                  type: decimal(5,2)
                  constraints:
                    nullable: false
              - column:
                  name: goal
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: fitness_level
                  type: VARCHAR(255)
              - column:
                  name: training_days
                  type: INT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_history
            baseColumnNames: user_id
            constraintName: fk_user_history_users
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: RESTRICT

        - createIndex:
            indexName: idx_user_history_user_id
            tableName: user_history
            columns:
              - column:
                  name: user_id
